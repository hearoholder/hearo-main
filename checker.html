<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEARO ADMIN | Ultra Premium Elite Checker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* SHARP ELITE RENKLERİ */
            --neon-cyan: #00e5ff; 
            --neon-green: #00ffaa; 
            --neon-red: #ff2a5f; 
            --panel-bg: rgba(6, 10, 20, 0.95); /* Keskin ve net koyu arkaplan (Bulanıklık YOK) */
            --panel-border: rgba(0, 229, 255, 0.15);
            --elite-shadow: 0 40px 80px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(0, 229, 255, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* DERİN UZAY ARKAPLANI */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #02040a;
            color: white;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; 
        }

        /* KUZEY IŞIKLARI (AURORA) */
        .aurora-container {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            overflow: hidden; z-index: -3; pointer-events: none;
        }
        .aurora {
            position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(from 0deg at 50% 50%, 
                rgba(0, 229, 255, 0.05) 0deg, 
                rgba(0, 102, 255, 0.05) 120deg, 
                transparent 180deg, 
                rgba(0, 229, 255, 0.02) 240deg, 
                rgba(0, 255, 170, 0.05) 360deg);
            animation: rotateAurora 30s linear infinite;
        }
        @keyframes rotateAurora { 100% { transform: rotate(360deg); } }

        /* YILDIZLAR İÇİN CANVAS */
        #starCanvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: -2; }

        /* GİRİŞ ANİMASYONU */
        @keyframes smoothEnter { 0% { opacity: 0; transform: translateY(30px) scale(0.98); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
        .tilt-container { width: 95%; max-width: 1300px; animation: smoothEnter 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; perspective: 1200px; z-index: 10;}
        
        /* KESKİN ANA PANEL (BLUR KALDIRILDI) */
        .checker-wrapper {
            background: var(--panel-bg); 
            border: 1px solid var(--panel-border);
            border-top: 1px solid rgba(0, 229, 255, 0.4);
            border-radius: 16px; padding: 40px;
            box-shadow: var(--elite-shadow);
            display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 30px; 
            transform-style: preserve-3d; transition: transform 0.1s ease-out;
            position: relative; overflow: hidden;
        }

        /* HEADER & LOGO */
        .header { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 20px; height: 70px; transform: translateZ(30px); }
        .logo { font-family: 'Outfit', sans-serif; font-size: 28px; font-weight: 800; letter-spacing: 1px; display: flex; align-items: center; gap: 12px; white-space: nowrap; flex-shrink: 0; }
        .logo svg { width: 32px; height: 32px; flex-shrink: 0; filter: drop-shadow(0 0 12px rgba(0,229,255,0.8)); }
        .logo span.hearo-text { color: white; }
        .logo span.checker-text { color: var(--neon-cyan); text-shadow: 0 0 20px rgba(0, 229, 255, 0.8); }
        
        .header-right { display: flex; align-items: center; gap: 15px; }
        .ping-indicator { font-family: 'Fira Code', monospace; font-size: 11px; font-weight: 600; color: var(--neon-cyan); display: flex; align-items: center; gap: 6px; background: #03060a; padding: 6px 14px; border-radius: 8px; border: 1px solid rgba(0,229,255,0.2); }
        .ping-dot { width: 6px; height: 6px; background: var(--neon-cyan); border-radius: 50%; box-shadow: 0 0 10px var(--neon-cyan); animation: blink 1.5s infinite; }

        @keyframes pulseGlow { 0% { box-shadow: 0 0 0px rgba(0,229,255,0); } 50% { box-shadow: 0 0 25px rgba(0,229,255,0.4); } 100% { box-shadow: 0 0 0px rgba(0,229,255,0); } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .status-badge { background: #03060a; color: white; padding: 8px 18px; border-radius: 8px; font-size: 13px; font-weight: 700; border: 1px solid rgba(255,255,255,0.1); text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; white-space: nowrap; flex-shrink: 0; display: flex; align-items: center; gap: 8px;}
        .status-badge.scanning { animation: pulseGlow 1.5s infinite; color: #fff; background: rgba(0, 229, 255, 0.1); border-color: var(--neon-cyan); }

        /* SOL PANEL */
        .input-area { display: flex; flex-direction: column; gap: 15px; transform: translateZ(20px); }
        .top-actions { display: flex; justify-content: space-between; align-items: flex-end; height: 25px; }
        
        .live-counter { font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 600; color: #64748b; display: flex; align-items: center; gap: 6px; transition: 0.3s;}
        .live-counter.active { color: white; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
        
        .success-label { display: none; color: var(--neon-green); font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 1px; align-items: center; gap: 8px; text-shadow: 0 0 15px rgba(0, 255, 136, 0.6); }
        .action-btns { display: flex; gap: 15px; margin-left: auto; }
        .btn-text { background: none; border: none; color: #64748b; font-family: 'Inter'; font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 6px; }
        .btn-text:hover { color: white; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .btn-text.green:hover { color: var(--neon-green); text-shadow: 0 0 10px rgba(0,255,136,0.5); }
        
        /* KESKİN TEXTAREA */
        textarea { width: 100%; height: 260px; background: #020408; border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 20px; color: #e2e8f0; font-family: 'Fira Code', monospace; font-size: 13px; resize: none; outline: none; transition: all 0.2s ease; line-height: 1.6; box-shadow: inset 0 2px 10px rgba(0,0,0,0.8); }
        textarea:focus { border-color: var(--neon-cyan); box-shadow: inset 0 2px 10px rgba(0,0,0,0.8), 0 0 15px rgba(0, 229, 255, 0.2); }
        textarea::-webkit-scrollbar { width: 6px; } textarea::-webkit-scrollbar-thumb { background: rgba(0, 229, 255, 0.3); border-radius: 10px; }
        textarea.success-mode { border-color: var(--neon-green); box-shadow: 0 0 20px rgba(0, 255, 136, 0.15); color: var(--neon-green); background: rgba(0, 255, 136, 0.02); }

        /* HIZ KONTROLÜ - KESKİN TASARIM */
        .speed-control { display: flex; align-items: center; gap: 15px; background: #020408; padding: 12px 18px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
        .speed-control label { font-size: 12px; color: #94a3b8; font-weight: 600; font-family: 'Outfit', sans-serif; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
        .speed-control label span { color: white; font-weight: 800; font-size: 15px; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
        .speed-control input[type=range] { flex: 1; -webkit-appearance: none; background: #1e293b; height: 4px; border-radius: 5px; outline: none; }
        .speed-control input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--neon-cyan); cursor: pointer; box-shadow: 0 0 15px var(--neon-cyan); transition: 0.2s; }
        .speed-control input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.3); }

        /* KESKİN PROGRESS BAR */
        .progress-container { width: 100%; height: 4px; background: #0f172a; border-radius: 10px; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; background: var(--neon-cyan); box-shadow: 0 0 15px var(--neon-cyan); transition: width 0.2s ease; position: relative; }
        .progress-bar::after { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent); animation: progressShine 1s infinite; }
        @keyframes progressShine { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

        /* BUTONLAR */
        .controls { display: flex; gap: 15px; height: 50px; }
        .main-btn { flex: 1; border: none; border-radius: 12px; font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.2s ease; display: flex; justify-content: center; align-items: center; gap: 10px; height: 100%; text-transform: uppercase; letter-spacing: 1px; }
        
        .btn-start { background: var(--neon-cyan); color: #02040a; box-shadow: 0 0 20px rgba(0, 229, 255, 0.3); }
        .btn-start:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(0, 229, 255, 0.6); background: white; }
        .btn-start:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(100%); transform: none; box-shadow: none; background: #334155; color: #94a3b8; }
        
        .btn-stop { background: transparent; border: 1px solid var(--neon-red); color: var(--neon-red); }
        .btn-stop:hover { background: var(--neon-red); color: white; box-shadow: 0 0 25px rgba(255, 42, 95, 0.5); transform: translateY(-2px); }
        .btn-stop:disabled { opacity: 0.3; cursor: not-allowed; border-color: rgba(255,255,255,0.1); color: #64748b; background: transparent; transform: none; box-shadow: none; }

        /* SAĞ PANEL KARTLARI */
        .right-panel { display: flex; flex-direction: column; gap: 15px; transform: translateZ(20px); }
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .stat-card { background: #020408; border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 20px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; transition: 0.3s; }
        
        .stat-card.hit-card:hover { border-color: var(--neon-green); box-shadow: 0 5px 25px rgba(0, 255, 170, 0.1); transform: translateY(-3px); }
        .stat-card.bad-card:hover { border-color: var(--neon-red); box-shadow: 0 5px 25px rgba(255, 42, 95, 0.1); transform: translateY(-3px); }
        .stat-card.total-card:hover { border-color: var(--neon-cyan); box-shadow: 0 5px 25px rgba(0, 229, 255, 0.1); transform: translateY(-3px); }
        
        .stat-value { font-size: 32px; font-weight: 800; font-family: 'Outfit', sans-serif; line-height: 1; }
        .stat-label { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; text-align: center; }
        .val-hit { color: var(--neon-green); text-shadow: 0 0 20px rgba(0, 255, 170, 0.5); }
        .val-bad { color: var(--neon-red); text-shadow: 0 0 20px rgba(255, 42, 95, 0.5); }
        .val-total { color: white; text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);} 
        .val-cpm { color: var(--neon-cyan); text-shadow: 0 0 20px rgba(0, 229, 255, 0.5);}

        /* KESKİN IP BAN KUTUSU */
        .ip-ban-box { display: flex; gap: 8px; height: 45px; align-items: center; background: #020408; padding: 5px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.05); }
        .ip-ban-box input { flex: 1; height: 100%; background: transparent; border: none; padding: 0 15px; color: white; font-family: 'Fira Code', monospace; font-size: 12px; outline: none; }
        .ip-ban-box input::placeholder { color: #475569; }
        .ip-btn-ban { height: 100%; padding: 0 16px; background: transparent; border: 1px solid var(--neon-red); color: var(--neon-red); border-radius: 8px; font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: 0.2s; }
        .ip-btn-ban:hover { background: var(--neon-red); color: white; box-shadow: 0 0 15px rgba(255, 42, 95, 0.5); }
        .ip-btn-unban { height: 100%; padding: 0 16px; background: transparent; border: 1px solid var(--neon-green); color: var(--neon-green); border-radius: 8px; font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: 0.2s; }
        .ip-btn-unban:hover { background: var(--neon-green); color: black; box-shadow: 0 0 15px rgba(0, 255, 170, 0.5); }

        /* KONSOL */
        .console-container { display: flex; flex-direction: column; background: #020408; border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; overflow: hidden; }
        .console-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; border-bottom: 1px solid rgba(255,255,255,0.02); background: rgba(255,255,255,0.01); }
        .console-title { font-size: 11px; color: #94a3b8; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
        .console-filters { display: flex; gap: 8px; }
        .c-filter { background: transparent; border: 1px solid rgba(255,255,255,0.1); color: #64748b; padding: 4px 12px; border-radius: 6px; font-size: 10px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .c-filter:hover { border-color: rgba(255,255,255,0.3); color: white; }
        .c-filter.active { background: rgba(0, 229, 255, 0.1); border-color: var(--neon-cyan); color: var(--neon-cyan); box-shadow: 0 0 10px rgba(0,229,255,0.2); }
        
        .console-logs { height: 110px; padding: 15px; overflow-y: auto; font-family: 'Fira Code', monospace; font-size: 12px; display: flex; flex-direction: column; gap: 6px; }
        .console-logs::-webkit-scrollbar { width: 4px; } .console-logs::-webkit-scrollbar-thumb { background: rgba(0, 229, 255, 0.3); border-radius: 10px; }
        .log { padding: 4px 10px; border-radius: 4px; display: flex; gap: 12px; animation: fadeIn 0.1s ease forwards; line-height: 1.5; word-break: break-all; border-left: 2px solid transparent; }
        .log-time { color: #475569; min-width: 75px; user-select: none; }
        .log.hit { background: rgba(0, 255, 170, 0.05); border-left-color: var(--neon-green); color: var(--neon-green); }
        .log.bad { color: var(--neon-red); background: rgba(255, 42, 95, 0.05); border-left-color: var(--neon-red); }
        .log.info { background: rgba(0, 229, 255, 0.05); border-left-color: var(--neon-cyan); color: var(--neon-cyan); }
        
        .console-logs.filter-hits .log:not(.hit):not(.info) { display: none !important; }

        @keyframes fadeIn { from { opacity: 0; transform: translateX(-5px); } to { opacity: 1; transform: translateX(0); } }
        .btn-back { position: absolute; top: 30px; left: 40px; color: #94a3b8; text-decoration: none; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 10px; transition: 0.2s; z-index: 10; font-family: 'Outfit', sans-serif; background: #020408; padding: 8px 16px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); }
        .btn-back:hover { color: white; border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0, 229, 255, 0.2); transform: translateX(-5px); }
    </style>
</head>

<!-- KUZEY IŞIKLARI (AURORA) -->

<script>
    const backendUrl = "https://billowing-smoke-cb6b.hearo.workers.dev";
    
    // YENİ: PARLAYAN VE KAYAN YILDIZLAR (CANVAS)
    const canvas = document.getElementById('starCanvas');
    const ctx = canvas.getContext('2d');
    let w = canvas.width = window.innerWidth;
    let h = canvas.height = window.innerHeight;
    
    const stars = [];
    for(let i=0; i<200; i++) {
        stars.push({
            x: Math.random() * w, y: Math.random() * h,
            r: Math.random() * 1.5,
            a: Math.random(),
            s: Math.random() * 0.05 + 0.01 // Twinkle speed
        });
    }

    const shootingStars = [];
    function spawnShootingStar() {
        if(Math.random() < 0.03) { // 3% ihtimalle kayan yıldız oluşur
            shootingStars.push({
                x: Math.random() * w, y: 0,
                len: Math.random() * 80 + 20,
                speed: Math.random() * 15 + 10,
                angle: Math.PI / 4,
                opacity: 1
            });
        }
    }

    function drawStars() {
        ctx.clearRect(0, 0, w, h);
        
        // Normal Yıldızlar
        stars.forEach(star => {
            star.a += star.s;
            if(star.a > 1 || star.a < 0.1) star.s = -star.s;
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(star.a)})`;
            ctx.fill();
        });

        // Kayan Yıldızlar
        spawnShootingStar();
        for(let i = shootingStars.length - 1; i >= 0; i--) {
            const ss = shootingStars[i];
            ctx.beginPath();
            ctx.moveTo(ss.x, ss.y);
            ctx.lineTo(ss.x - Math.cos(ss.angle) * ss.len, ss.y - Math.sin(ss.angle) * ss.len);
            ctx.strokeStyle = `rgba(255, 255, 255, ${ss.opacity})`;
            ctx.lineWidth = 1.5;
            ctx.stroke();
            
            ss.x += Math.cos(ss.angle) * ss.speed;
            ss.y += Math.sin(ss.angle) * ss.speed;
            ss.opacity -= 0.02;
            
            if(ss.opacity <= 0 || ss.x > w || ss.y > h) shootingStars.splice(i, 1);
        }
        
        requestAnimationFrame(drawStars);
    }
    drawStars();
    window.addEventListener('resize', () => { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; });

    // Dinamik Satır Sayacı
    function updateLineCount() {
        const raw = document.getElementById('cookieInput').value.trim();
        const lines = raw ? raw.split('\n').filter(line => line.trim() !== '' && !line.trim().startsWith('#')).length : 0;
        document.getElementById('lineCount').innerText = lines;
        const counter = document.getElementById('liveCounter');
        if(lines > 0) counter.classList.add('active'); else counter.classList.remove('active');
    }

    // Arayüz Hareket Efekti
    const tiltWrapper = document.getElementById('tiltWrapper');
    document.addEventListener('mousemove', (e) => {
        const xAxis = ((window.innerWidth / 2) - e.pageX) / 180;
        const yAxis = ((window.innerHeight / 2) - e.pageY) / 180;
        tiltWrapper.style.transform = `rotateY(${xAxis}deg) rotateX(${-yAxis}deg)`;
    });
    document.addEventListener('mouseleave', () => tiltWrapper.style.transform = `rotateY(0deg) rotateX(0deg)`);

    let isRunning = false; let cookies = []; let currentIndex = 0; let hits = 0; let bads = 0; let startTime = 0; let hitList = []; 
    
    const el = {
        input: document.getElementById('cookieInput'), btnStart: document.getElementById('btnStart'), btnStop: document.getElementById('btnStop'),
        hit: document.getElementById('hitCount'), bad: document.getElementById('badCount'), total: document.getElementById('totalCount'), cpm: document.getElementById('cpmCount'),
        log: document.getElementById('consoleLog'), badge: document.getElementById('statusBadge'), successLabel: document.getElementById('successLabel'),
        liveCount: document.getElementById('liveCounter'), btnCopy: document.getElementById('btnCopy'), btnDownload: document.getElementById('btnDownload'), progBar: document.getElementById('progressBar')
    };

    const getTime = () => { const d = new Date(); return `[${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}:${d.getSeconds().toString().padStart(2,'0')}]`; };

    function setFilter(type) {
        document.getElementById('f-all').classList.remove('active'); document.getElementById('f-hit').classList.remove('active');
        if (type === 'hits') { document.getElementById('f-hit').classList.add('active'); el.log.classList.add('filter-hits'); } 
        else { document.getElementById('f-all').classList.add('active'); el.log.classList.remove('filter-hits'); }
        el.log.scrollTop = el.log.scrollHeight;
    }

    function clearInput() {
        el.input.value = ''; el.input.classList.remove('success-mode'); updateLineCount();
        el.successLabel.style.display = 'none'; el.liveCount.style.display = 'flex';
        el.btnCopy.style.display = 'none'; el.btnDownload.style.display = 'none';
        el.progBar.style.width = '0%';
    }

    function copyHits() {
        navigator.clipboard.writeText(hitList.join('\n'));
        addLog('info', 'Çalışan çerezler panoya kopyalandı.');
        el.btnCopy.innerHTML = '<i class="fa-solid fa-check"></i> Kopyalandı';
        setTimeout(() => el.btnCopy.innerHTML = '<i class="fa-regular fa-copy"></i> Kopyala', 2000);
    }

    function downloadHits() {
        const blob = new Blob([hitList.join('\n')], { type: 'text/plain' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `HEARO_ELITE_HITS_${hits}.txt`; a.click();
        window.URL.revokeObjectURL(url);
        addLog('info', 'Sonuçlar bilgisayarınıza indirildi.');
    }

    function addLog(type, msg) {
        const div = document.createElement('div');
        div.className = `log ${type}`; div.innerHTML = `<span class="log-time">${getTime()}</span><span>${msg}</span>`;
        el.log.appendChild(div);
        if (el.log.children.length > 200) el.log.removeChild(el.log.firstChild);
        el.log.scrollTop = el.log.scrollHeight;
    }

    function animateValue(obj, start, end, duration) {
        let startTimestamp = null;
        const step = (timestamp) => {
            if (!startTimestamp) startTimestamp = timestamp;
            const progress = Math.min((timestamp - startTimestamp) / duration, 1);
            obj.innerHTML = Math.floor(progress * (end - start) + start);
            if (progress < 1) { window.requestAnimationFrame(step); } else { obj.innerHTML = end; }
        };
        window.requestAnimationFrame(step);
    }

    function updateStats(newTotal) {
        if(el.hit.textContent != hits) animateValue(el.hit, parseInt(el.hit.textContent), hits, 200);
        if(el.bad.textContent != bads) animateValue(el.bad, parseInt(el.bad.textContent), bads, 200);
        el.total.textContent = `${newTotal} / ${cookies.length}`;
        
        const mins = (Date.now() - startTime) / 1000 / 60;
        if (mins > 0) el.cpm.textContent = Math.floor(newTotal / mins).toLocaleString();
        
        const percent = (newTotal / cookies.length) * 100;
        el.progBar.style.width = `${percent}%`;
    }

    async function manageIP(actionType) {
        const ipInput = document.getElementById('ipBanInput');
        const ip = ipInput.value.trim();
        if (!ip) { addLog('bad', 'HATA: Lütfen bir IP adresi girin.'); return; }
        try {
            const res = await fetch(backendUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tur: actionType, detay: { ip: ip } }) });
            if (res.ok) {
                const data = await res.json();
                if (data.error === "KV_YOK") addLog('bad', `[SİSTEM HATASI] Cloudflare KV veritabanına ulaşılamıyor.`);
                else { addLog(actionType === 'ban_ip' ? 'bad' : 'hit', `[GÜVENLİK PROTOKOLÜ] ${ip} ${actionType === 'ban_ip' ? 'sistemden uzaklaştırıldı' : 'tekrar erişime açıldı'}.`); ipInput.value = ''; }
            } else { addLog('bad', `[HATA] Ağ bağlantısı reddedildi.`); }
        } catch(e) { addLog('bad', `[HATA] Sunucu yanıt vermiyor.`); }
    }

    async function startCheck() {
        const raw = el.input.value.trim();
        if (!raw) { addLog('bad', 'HATA: Veri girişi tespit edilemedi.'); return; }
        cookies = raw.split('\n').filter(line => line.trim() !== '' && !line.trim().startsWith('#'));
        if (cookies.length === 0) return;

        isRunning = true; currentIndex = 0; hits = 0; bads = 0; startTime = Date.now(); hitList = [];
        el.input.classList.remove('success-mode'); el.successLabel.style.display = 'none'; el.liveCount.style.display = 'none';
        el.btnCopy.style.display = 'none'; el.btnDownload.style.display = 'none';
        el.btnStart.disabled = true; el.btnStop.disabled = false; el.input.disabled = true;
        
        el.badge.classList.add('scanning');
        el.badge.innerHTML = '<i class="fa-solid fa-radar fa-beat"></i> TARAMA SÜRÜYOR...';
        
        const threads = parseInt(document.getElementById('threadSlider').value) || 10;
        addLog('info', `Güç: ${threads} Thread aktif. Gerçek zamanlı tarama başlatıldı...`);
        el.progBar.style.width = '0%';
        
        while (currentIndex < cookies.length && isRunning) {
            const batch = cookies.slice(currentIndex, currentIndex + threads);
            currentIndex += batch.length;
            
            const promises = batch.map(async (cookie) => {
                try {
                    const response = await fetch(backendUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tur: "check_cookie", detay: { cookie: cookie } }) });
                    const data = await response.json();
                    if (data.valid) { hits++; hitList.push(cookie); addLog('hit', `[ONAYLANDI] ${cookie.substring(0, 20)}...`); } 
                    else { bads++; addLog('bad', `[REDDEDİLDİ] ${cookie.substring(0, 20)}...`); }
                } catch (err) { bads++; addLog('bad', `[HATA] İstek zaman aşımına uğradı.`); }
            });
            
            await Promise.all(promises);
            updateStats(currentIndex);
        }
        
        if(isRunning) finishCheck();
    }

    function stopCheck() {
        isRunning = false; el.btnStart.disabled = false; el.btnStop.disabled = true; el.input.disabled = false;
        el.badge.classList.remove('scanning');
        el.badge.innerHTML = '<i class="fa-solid fa-stop"></i> DURDURULDU';
        el.badge.style.color = 'var(--neon-red)'; el.badge.style.borderColor = 'rgba(255,42,95,0.3)';
        addLog('info', 'Sistem manuel olarak durduruldu.');
    }

    function finishCheck() {
        isRunning = false; el.btnStart.disabled = false; el.btnStop.disabled = true; el.input.disabled = false;
        el.badge.classList.remove('scanning');
        el.badge.innerHTML = '<i class="fa-solid fa-check-double"></i> TAMAMLANDI';
        el.badge.style.color = 'var(--neon-cyan)'; el.badge.style.borderColor = 'rgba(0,229,255,0.3)';
        addLog('info', `İşlem Bitti. Sonuç: ${hits} Aktif | ${bads} Pasif.`);

        if (hits > 0) {
            el.successLabel.style.display = 'flex'; 
            el.btnCopy.style.display = 'flex'; 
            el.btnDownload.style.display = 'flex';
            el.input.value = hitList.join('\n'); el.input.classList.add('success-mode');
            addLog('hit', '>>> Başarılı çerezler ekrana yansıtıldı.');
        } else {
            el.input.value = "Test edilen tüm veriler geçersiz.";
        }
    }
</script>
</body>
</html>
