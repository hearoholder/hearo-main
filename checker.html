<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800;900&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /*  */
            --neon-cyan: #00e5ff; 
            --neon-red: #ff2a5f; 
            --neon-green: #00ffaa;
            
            /*  */
            --panel-bg: rgba(3, 5, 8, 0.6); 
            --panel-border: rgba(0, 229, 255, 0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        /*  () */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #010204;
            color: white;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; 
        }

        /*  () */
        .nebula-glow { position: absolute; filter: blur(150px); opacity: 0.05; z-index: -3; pointer-events: none; border-radius: 50%; }
        .nebula-1 { top: -20%; left: -10%; width: 700px; height: 700px; background: #00e5ff; }
        .nebula-2 { bottom: -20%; right: -10%; width: 700px; height: 700px; background: #0088ff; }

        /*  */
        #starCanvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: -2; }

        /*  */
        @keyframes smoothEnter { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
        .tilt-container { width: 95%; max-width: 1300px; animation: smoothEnter 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; perspective: 1200px; z-index: 10;}
        
        /*  */
        .checker-wrapper {
            background: var(--panel-bg); 
            border: 1px solid var(--panel-border);
            border-top: 1px solid rgba(0, 229, 255, 0.25);
            border-radius: 16px; padding: 40px;
            box-shadow: 0 40px 80px rgba(0,0,0,0.95), inset 0 1px 0 rgba(0,229,255,0.15);
            display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 30px; 
            position: relative;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        /*  */
        .header { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.03); padding-bottom: 20px; height: 70px; }
        .logo { font-family: 'Outfit', sans-serif; font-size: 26px; font-weight: 800; letter-spacing: 1px; display: flex; align-items: center; gap: 12px; white-space: nowrap; flex-shrink: 0; }
        .logo svg { width: 30px; height: 30px; flex-shrink: 0; filter: drop-shadow(0 0 10px rgba(0,229,255,0.6)); }
        .logo span.hearo-text { color: white; }
        .logo span.checker-text { color: var(--neon-cyan); text-shadow: 0 0 15px rgba(0, 229, 255, 0.5); }
        
        /*  */
        .header-right { display: flex; align-items: center; gap: 12px; height: 38px; }
        .header-badge { 
            height: 100%;
            display: flex; align-items: center; justify-content: center; gap: 8px; 
            background: rgba(0,0,0,0.5); border: 1px solid rgba(0,229,255,0.2); 
            padding: 0 16px; border-radius: 8px; 
            font-family: 'Outfit', sans-serif; font-size: 11px; font-weight: 700; color: var(--neon-cyan); 
            text-transform: uppercase; letter-spacing: 1px; 
            white-space: nowrap; /*  */
            box-shadow: inset 0 0 10px rgba(0,229,255,0.03);
            transition: 0.3s;
        }
        .ping-dot { width: 6px; height: 6px; background: var(--neon-cyan); border-radius: 50%; box-shadow: 0 0 8px var(--neon-cyan); animation: blink 1.5s infinite; }

        @keyframes pulseGlow { 0% { box-shadow: inset 0 0 10px rgba(0,229,255,0.05), 0 0 0px rgba(0,229,255,0); } 50% { box-shadow: inset 0 0 15px rgba(0,229,255,0.15), 0 0 15px rgba(0,229,255,0.2); } 100% { box-shadow: inset 0 0 10px rgba(0,229,255,0.05), 0 0 0px rgba(0,229,255,0); } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .header-badge.scanning { animation: pulseGlow 1.5s infinite; border-color: var(--neon-cyan); color: white; background: rgba(0,229,255,0.1);}

        /* */
        .input-area { display: flex; flex-direction: column; gap: 15px; }
        .top-actions { display: flex; justify-content: space-between; align-items: flex-end; height: 25px; }
        
        .live-counter { font-family: 'Fira Code', monospace; font-size: 11px; font-weight: 600; color: #64748b; display: flex; align-items: center; gap: 6px; transition: 0.3s;}
        .live-counter.active { color: var(--neon-cyan); text-shadow: 0 0 10px rgba(0,229,255,0.3); }
        
        /*  */
        .action-btns { display: flex; gap: 18px; margin-left: auto; align-items: center;}
        .btn-text { background: none; border: none; color: #64748b; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 6px; }
        .btn-text:hover { color: var(--neon-cyan); }
        .btn-text i { font-size: 14px; }
        
        textarea { width: 100%; height: 260px; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.03); border-radius: 12px; padding: 20px; color: #e2e8f0; font-family: 'Fira Code', monospace; font-size: 13px; resize: none; outline: none; transition: all 0.2s ease; line-height: 1.6; box-shadow: inset 0 2px 15px rgba(0,0,0,0.8); }
        textarea:focus { border-color: var(--neon-cyan); box-shadow: inset 0 2px 15px rgba(0,0,0,0.8), 0 0 15px rgba(0, 229, 255, 0.1); }
        textarea::-webkit-scrollbar { width: 6px; } textarea::-webkit-scrollbar-thumb { background: rgba(0, 229, 255, 0.2); border-radius: 10px; }
        textarea.success-mode { border-color: var(--neon-cyan); box-shadow: inset 0 2px 15px rgba(0,0,0,0.8), 0 0 20px rgba(0, 229, 255, 0.15); color: var(--neon-cyan); background: rgba(0, 229, 255, 0.02); }

        /*  */
        .speed-control { display: flex; align-items: center; gap: 15px; background: rgba(0,0,0,0.5); padding: 12px 18px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.02); }
        .speed-control label { font-size: 11px; color: #94a3b8; font-weight: 700; font-family: 'Outfit', sans-serif; white-space: nowrap; display: flex; align-items: center; gap: 6px; text-transform: uppercase;}
        .speed-control label span { color: white; font-weight: 800; font-size: 14px; }
        .speed-control input[type=range] { flex: 1; -webkit-appearance: none; background: #0f172a; height: 4px; border-radius: 5px; outline: none; }
        .speed-control input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--neon-cyan); cursor: pointer; box-shadow: 0 0 15px var(--neon-cyan); transition: 0.2s; }
        .speed-control input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.3); }

        /*  */
        .progress-container { width: 100%; height: 2px; background: #0f172a; border-radius: 10px; overflow: hidden; margin-top: 2px;}
        .progress-bar { height: 100%; width: 0%; background: var(--neon-cyan); box-shadow: 0 0 15px var(--neon-cyan); transition: width 0.2s ease; position: relative; }

        /*  */
        .controls { display: flex; gap: 15px; height: 50px; }
        .main-btn { flex: 1; border: none; border-radius: 8px; font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 800; cursor: pointer; transition: 0.2s ease; display: flex; justify-content: center; align-items: center; gap: 10px; height: 100%; text-transform: uppercase; letter-spacing: 1px; }
        
        .btn-start { background: var(--neon-cyan); color: #000; box-shadow: 0 0 25px rgba(0, 229, 255, 0.3); }
        .btn-start:hover { box-shadow: 0 0 35px rgba(0, 229, 255, 0.5); transform: scale(1.02); }
        .btn-start:disabled { opacity: 0.3; cursor: not-allowed; filter: grayscale(100%); transform: none; box-shadow: none; }
        
        .btn-stop { background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.05); color: #64748b; }
        .btn-stop:hover:not(:disabled) { background: rgba(255, 42, 95, 0.1); color: var(--neon-red); border-color: var(--neon-red); }
        .btn-stop:disabled { opacity: 0.5; cursor: not-allowed; }

        /*  */
        .right-panel { display: flex; flex-direction: column; gap: 15px; }
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .stat-card { background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.02); border-radius: 12px; padding: 20px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; transition: 0.3s; position: relative; overflow: hidden; box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);}
        
        .stat-card::before { content:''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 0%; height: 2px; background: transparent; transition: 0.3s; }
        .stat-card.hit-card:hover::before { width: 100%; background: var(--neon-cyan); box-shadow: 0 0 15px var(--neon-cyan); }
        .stat-card.bad-card:hover::before { width: 100%; background: var(--neon-red); box-shadow: 0 0 15px var(--neon-red); }
        .stat-card.total-card:hover::before { width: 100%; background: white; box-shadow: 0 0 15px white; }
        
        .stat-card:hover { background: rgba(255,255,255,0.02); transform: translateY(-3px); }
        
        .stat-value { font-size: 32px; font-weight: 800; font-family: 'Outfit', sans-serif; line-height: 1; }
        .stat-label { font-size: 10px; color: #64748b; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; text-align: center; }
        .val-hit { color: var(--neon-cyan); text-shadow: 0 0 20px rgba(0, 229, 255, 0.4); }
        .val-bad { color: var(--neon-red); text-shadow: 0 0 20px rgba(255, 42, 95, 0.4); }
        .val-total { color: white; text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);} 
        .val-cpm { color: var(--neon-cyan); text-shadow: 0 0 20px rgba(0, 229, 255, 0.4);}

        /*  */
        .ip-ban-box { display: flex; gap: 8px; height: 45px; align-items: center; background: rgba(0,0,0,0.5); padding: 5px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.02); }
        .ip-ban-box input { flex: 1; height: 100%; background: transparent; border: none; padding: 0 15px; color: white; font-family: 'Fira Code', monospace; font-size: 11px; outline: none; }
        .ip-ban-box input::placeholder { color: #475569; }
        .ip-btn-ban { height: 100%; padding: 0 16px; background: transparent; border: 1px solid rgba(255,42,95,0.3); color: var(--neon-red); border-radius: 6px; font-family: 'Outfit', sans-serif; font-size: 12px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .ip-btn-ban:hover { background: rgba(255,42,95,0.15); box-shadow: 0 0 10px rgba(255,42,95,0.2); border-color: var(--neon-red);}
        .ip-btn-unban { height: 100%; padding: 0 16px; background: transparent; border: 1px solid rgba(0,255,170,0.3); color: var(--neon-green); border-radius: 6px; font-family: 'Outfit', sans-serif; font-size: 12px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .ip-btn-unban:hover { background: rgba(0,255,170,0.15); box-shadow: 0 0 10px rgba(0,255,170,0.2); border-color: var(--neon-green);}

        /*  */
        .console-container { position: relative; display: flex; flex-direction: column; background: #000000; border: 1px solid rgba(0, 229, 255, 0.15); border-radius: 12px; overflow: hidden; box-shadow: inset 0 0 30px rgba(0,0,0,1); }
        
        /*  */
        #matrixCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.15; pointer-events: none; }

        .console-header { position: relative; z-index: 1; display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; border-bottom: 1px solid rgba(255,255,255,0.05); background: #030508; }
        .console-title { font-size: 11px; color: #cbd5e1; font-family: 'Outfit', sans-serif; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
        .console-filters { display: flex; gap: 8px; }
        .c-filter { background: transparent; border: 1px solid rgba(255,255,255,0.1); color: #64748b; padding: 4px 12px; border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .c-filter:hover { border-color: rgba(255,255,255,0.3); color: white; }
        .c-filter.active { background: rgba(0, 229, 255, 0.1); border-color: var(--neon-cyan); color: var(--neon-cyan); }
        
        
        .console-logs { position: relative; z-index: 1; height: 115px; padding: 10px; overflow-y: auto; font-family: 'Fira Code', monospace; font-size: 11px; display: flex; flex-direction: column; gap: 6px; }
        .console-logs::-webkit-scrollbar { width: 4px; } .console-logs::-webkit-scrollbar-thumb { background: rgba(0, 229, 255, 0.2); border-radius: 10px; }
        
        
        @keyframes popIn {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        
        .log { 
            padding: 6px 12px; border-radius: 4px; display: flex; gap: 12px; 
            animation: popIn 0.2s ease-out forwards; 
            line-height: 1.4; word-wrap: break-word; word-break: normal; white-space: pre-wrap; 
            background: rgba(255,255,255,0.02); border-left: 2px solid transparent; 
        }
        
        .log-time { color: #64748b; min-width: 70px; user-select: none; font-weight: 500;}
        .log.hit { background: rgba(0, 255, 170, 0.05); border-left-color: var(--neon-green); color: var(--neon-green); }
        .log.bad { background: rgba(255, 42, 95, 0.05); border-left-color: var(--neon-red); color: var(--neon-red); }
        .log.info { background: rgba(0, 229, 255, 0.05); border-left-color: var(--neon-cyan); color: var(--neon-cyan); }
        
        .console-logs.filter-hits .log:not(.hit):not(.info) { display: none !important; }

        
        .typing-cursor::after { content: '█'; animation: blinkType 1s step-start infinite; color: var(--neon-cyan); margin-left: 4px; }
        @keyframes blinkType { 50% { opacity: 0; } }

        .btn-back { position: absolute; top: 30px; left: 40px; color: #64748b; text-decoration: none; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 10px; transition: 0.2s; z-index: 10; font-family: 'Outfit', sans-serif; background: rgba(0,0,0,0.5); padding: 8px 16px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); }
        .btn-back:hover { color: white; border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0, 229, 255, 0.2); transform: translateX(-5px); }
    </style>
</head>

<script>
    const backendUrl = "https://billowing-smoke-cb6b.hearo.workers.dev";
    
    // --- 1. 
    const sCanvas = document.getElementById('starCanvas');
    const sCtx = sCanvas.getContext('2d');
    let w = sCanvas.width = window.innerWidth;
    let h = sCanvas.height = window.innerHeight;
    
    const stars = [];
    for(let i=0; i<300; i++) {
        stars.push({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.5, a: Math.random(), s: Math.random() * 0.02 + 0.01 });
    }

    const shootingStars = [];
    function spawnShootingStar() {
        if(Math.random() < 0.05) { // 
            shootingStars.push({ 
                x: Math.random() * w * 1.5, 
                y: Math.random() * h * 0.5 - 200, 
                len: Math.random() * 100 + 40, // 
                speed: Math.random() * 15 + 10, 
                angle: Math.PI / 4 + (Math.random() * 0.1 - 0.05), 
                opacity: 1, 
                thickness: Math.random() * 1 + 0.5 
            });
        }
    }

    function drawStars() {
        sCtx.clearRect(0, 0, w, h);
        
        stars.forEach(star => {
            star.a += star.s;
            if(star.a > 1 || star.a < 0.1) star.s = -star.s;
            sCtx.beginPath(); sCtx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
            sCtx.fillStyle = `rgba(255, 255, 255, ${Math.abs(star.a)})`; sCtx.fill();
        });

        spawnShootingStar();
        for(let i = shootingStars.length - 1; i >= 0; i--) {
            const ss = shootingStars[i];
            const tailX = ss.x - Math.cos(ss.angle) * ss.len;
            const tailY = ss.y - Math.sin(ss.angle) * ss.len;
            
            const grad = sCtx.createLinearGradient(ss.x, ss.y, tailX, tailY);
            grad.addColorStop(0, `rgba(255, 255, 255, ${ss.opacity})`);
            grad.addColorStop(0.1, `rgba(0, 229, 255, ${ss.opacity * 0.8})`); 
            grad.addColorStop(1, `rgba(0, 0, 0, 0)`);

            sCtx.beginPath(); sCtx.moveTo(ss.x, ss.y); sCtx.lineTo(tailX, tailY);
            sCtx.strokeStyle = grad; sCtx.lineWidth = ss.thickness; sCtx.shadowBlur = 10; sCtx.shadowColor = '#00e5ff';
            sCtx.stroke(); sCtx.shadowBlur = 0; 
            
            sCtx.beginPath(); sCtx.arc(ss.x, ss.y, ss.thickness * 1.5, 0, Math.PI*2);
            sCtx.fillStyle = `rgba(255, 255, 255, ${ss.opacity})`; sCtx.fill();

            ss.x += Math.cos(ss.angle) * ss.speed; ss.y += Math.sin(ss.angle) * ss.speed; ss.opacity -= 0.015;
            if(ss.opacity <= 0 || ss.x > w || ss.y > h) shootingStars.splice(i, 1);
        }
        requestAnimationFrame(drawStars);
    }
    drawStars();
    window.addEventListener('resize', () => { w = sCanvas.width = window.innerWidth; h = sCanvas.height = window.innerHeight; });

    // --- 2.  ---
    const mCanvas = document.getElementById('matrixCanvas');
    const mCtx = mCanvas.getContext('2d');
    const terminalContainer = document.getElementById('terminalContainer');
    
    let mCols = 0;
    let mDrops = [];
    const mFontSize = 10;
    const mChars = '0123456789ABCDEF'.split('');

    function resizeMatrix() {
        mCanvas.width = terminalContainer.offsetWidth;
        mCanvas.height = terminalContainer.offsetHeight;
        mCols = mCanvas.width / mFontSize;
        mDrops = [];
        for(let x = 0; x < mCols; x++) mDrops[x] = Math.random() * -50;
    }
    resizeMatrix();
    window.addEventListener('resize', resizeMatrix);

    function drawMatrix() {
        mCtx.fillStyle = 'rgba(0, 0, 0, 0.2)'; 
        mCtx.fillRect(0, 0, mCanvas.width, mCanvas.height);
        
        mCtx.font = mFontSize + "px 'Fira Code', monospace";
        
        for(let i = 0; i < mDrops.length; i++) {
            const text = mChars[Math.floor(Math.random() * mChars.length)];
            mCtx.fillStyle = 'rgba(0, 229, 255, 0.3)'; // Çok şeffaf buz mavisi/gri
            mCtx.fillText(text, i * mFontSize, mDrops[i] * mFontSize);
            if(mDrops[i] * mFontSize > mCanvas.height && Math.random() > 0.95) mDrops[i] = 0;
            mDrops[i]++;
        }
    }
    setInterval(drawMatrix, 50);

    // --- 3.  ---
    const getTime = () => { const d = new Date(); return `[${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}:${d.getSeconds().toString().padStart(2,'0')}]`; };
    
    window.onload = () => {
        document.getElementById('twTime').innerText = getTime();
        const textToType = "HEARO Checker aktif. Veri girişi bekleniyor...";
        let i = 0;
        const twElement = document.getElementById('twText');
        
        function typeWriter() {
            if (i < textToType.length) {
                twElement.innerHTML += textToType.charAt(i);
                i++;
                setTimeout(typeWriter, 35);
            } else {
                twElement.classList.remove('typing-cursor');
            }
        }
        setTimeout(typeWriter, 600);
    };

    // ---  ---
    function updateLineCount() {
        const raw = document.getElementById('cookieInput').value.trim();
        const lines = raw ? raw.split('\n').filter(line => line.trim() !== '' && !line.trim().startsWith('#')).length : 0;
        document.getElementById('lineCount').innerText = lines;
        const counter = document.getElementById('liveCounter');
        if(lines > 0) counter.classList.add('active'); else counter.classList.remove('active');
    }

    const tiltWrapper = document.getElementById('tiltWrapper');
    document.addEventListener('mousemove', (e) => {
        const xAxis = ((window.innerWidth / 2) - e.pageX) / 200;
        const yAxis = ((window.innerHeight / 2) - e.pageY) / 200;
        tiltWrapper.style.transform = `rotateY(${xAxis}deg) rotateX(${-yAxis}deg)`;
    });
    document.addEventListener('mouseleave', () => tiltWrapper.style.transform = `rotateY(0deg) rotateX(0deg)`);

    let isRunning = false; let cookies = []; let currentIndex = 0; let hits = 0; let bads = 0; let startTime = 0; let hitList = []; 
    
    const el = {
        input: document.getElementById('cookieInput'), btnStart: document.getElementById('btnStart'), btnStop: document.getElementById('btnStop'),
        hit: document.getElementById('hitCount'), bad: document.getElementById('badCount'), total: document.getElementById('totalCount'), cpm: document.getElementById('cpmCount'),
        log: document.getElementById('consoleLog'), badge: document.getElementById('statusBadge'),
        liveCount: document.getElementById('liveCounter'), btnCopy: document.getElementById('btnCopy'), btnDownload: document.getElementById('btnDownload'), progBar: document.getElementById('progressBar')
    };

    function setFilter(type) {
        document.getElementById('f-all').classList.remove('active'); document.getElementById('f-hit').classList.remove('active');
        if (type === 'hits') { document.getElementById('f-hit').classList.add('active'); el.log.classList.add('filter-hits'); } 
        else { document.getElementById('f-all').classList.add('active'); el.log.classList.remove('filter-hits'); }
        el.log.scrollTop = el.log.scrollHeight;
    }

    function clearInput() {
        el.input.value = ''; el.input.classList.remove('success-mode'); updateLineCount();
        el.progBar.style.width = '0%';
    }

    function copyHits() {
        if (hits === 0) { addLog('bad', 'Kopyalanacak başarılı çerez bulunamadı.'); return; }
        navigator.clipboard.writeText(hitList.join('\n'));
        el.btnCopy.innerHTML = '<i class="fa-solid fa-check"></i> Kopyalandı';
        setTimeout(() => el.btnCopy.innerHTML = '<i class="fa-regular fa-copy"></i> Kopyala', 2000);
    }

    function downloadHits() {
        if (hits === 0) { addLog('bad', 'İndirilecek başarılı çerez bulunamadı.'); return; }
        const blob = new Blob([hitList.join('\n')], { type: 'text/plain' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `HEARO_HITS_${hits}.txt`; a.click();
        window.URL.revokeObjectURL(url);
    }

    function addLog(type, msg) {
        const div = document.createElement('div');
        div.className = `log ${type}`; div.innerHTML = `<span class="log-time">${getTime()}</span><span>${msg}</span>`;
        el.log.appendChild(div);
        if (el.log.children.length > 200) el.log.removeChild(el.log.firstChild);
        el.log.scrollTop = el.log.scrollHeight;
    }

    function animateValue(obj, start, end, duration) {
        let startTimestamp = null;
        const step = (timestamp) => {
            if (!startTimestamp) startTimestamp = timestamp;
            const progress = Math.min((timestamp - startTimestamp) / duration, 1);
            obj.innerHTML = Math.floor(progress * (end - start) + start);
            if (progress < 1) { window.requestAnimationFrame(step); } else { obj.innerHTML = end; }
        };
        window.requestAnimationFrame(step);
    }

    function updateStats(newTotal) {
        if(el.hit.textContent != hits) animateValue(el.hit, parseInt(el.hit.textContent), hits, 200);
        if(el.bad.textContent != bads) animateValue(el.bad, parseInt(el.bad.textContent), bads, 200);
        el.total.textContent = `${newTotal} / ${cookies.length}`;
        
        const mins = (Date.now() - startTime) / 1000 / 60;
        if (mins > 0) el.cpm.textContent = Math.floor(newTotal / mins).toLocaleString();
        
        const percent = (newTotal / cookies.length) * 100;
        el.progBar.style.width = `${percent}%`;
    }

    async function manageIP(actionType) {
        const ipInput = document.getElementById('ipBanInput');
        const ip = ipInput.value.trim();
        if (!ip) { addLog('bad', 'HATA: Lütfen bir IP adresi girin.'); return; }
        try {
            const res = await fetch(backendUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tur: actionType, detay: { ip: ip } }) });
            if (res.ok) {
                const data = await res.json();
                if (data.error === "KV_YOK") addLog('bad', `[SİSTEM HATASI] Cloudflare KV veritabanına ulaşılamıyor.`);
                else { addLog('info', `[GÜVENLİK DUVARI] ${ip} ${actionType === 'ban_ip' ? 'ağdan engellendi' : 'beyaz listeye alındı'}.`); ipInput.value = ''; }
            } else { addLog('bad', `[HATA] Ağ bağlantısı reddedildi.`); }
        } catch(e) { addLog('bad', `[HATA] Sunucu yanıt vermiyor.`); }
    }

    async function startCheck() {
        const raw = el.input.value.trim();
        if (!raw) { addLog('bad', 'HATA: İşlenecek veri bulunamadı.'); return; }
        cookies = raw.split('\n').filter(line => line.trim() !== '' && !line.trim().startsWith('#'));
        if (cookies.length === 0) return;

        isRunning = true; currentIndex = 0; hits = 0; bads = 0; startTime = Date.now(); hitList = [];
        el.input.classList.remove('success-mode'); 
        el.btnStart.disabled = true; el.btnStop.disabled = false; el.input.disabled = true;
        
        el.badge.classList.add('scanning');
        el.badge.innerHTML = '<i class="fa-solid fa-radar fa-spin"></i> TARAMA SÜRÜYOR...';
        
        const threads = parseInt(document.getElementById('threadSlider').value) || 10;
        addLog('info', `Güç: ${threads} Thread aktif. Asenkron tarama başlatıldı...`);
        el.progBar.style.width = '0%';
        
        while (currentIndex < cookies.length && isRunning) {
            const batch = cookies.slice(currentIndex, currentIndex + threads);
            currentIndex += batch.length;
            
            const promises = batch.map(async (cookie) => {
                try {
                    const response = await fetch(backendUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tur: "check_cookie", detay: { cookie: cookie } }) });
                    const data = await response.json();
                    if (data.valid) { hits++; hitList.push(cookie); addLog('hit', `[ÇALIŞIYOR] ${cookie.substring(0, 30)}...`); } 
                    else { bads++; addLog('bad', `[REDDEDİLDİ] ${cookie.substring(0, 30)}...`); }
                } catch (err) { bads++; addLog('bad', `[ZAMAN AŞIMI] İstek gönderilemedi.`); }
            });
            
            await Promise.all(promises);
            updateStats(currentIndex);
        }
        
        if(isRunning) finishCheck();
    }

    function stopCheck() {
        isRunning = false; el.btnStart.disabled = false; el.btnStop.disabled = true; el.input.disabled = false;
        el.badge.classList.remove('scanning');
        el.badge.innerHTML = '<i class="fa-solid fa-stop"></i> DURDURULDU';
        el.badge.style.borderColor = 'rgba(255,42,95,0.4)'; el.badge.style.color = 'var(--neon-red)';
        addLog('info', 'Sistem manuel olarak durduruldu.');
    }

    function finishCheck() {
        isRunning = false; el.btnStart.disabled = false; el.btnStop.disabled = true; el.input.disabled = false;
        el.badge.classList.remove('scanning');
        el.badge.innerHTML = '<i class="fa-solid fa-check-double"></i> TAMAMLANDI';
        el.badge.style.borderColor = 'rgba(0,229,255,0.4)'; el.badge.style.color = 'var(--neon-cyan)';
        addLog('info', `İşlem Bitti. Sonuç: ${hits} Aktif | ${bads} Pasif.`);

        if (hits > 0) {
            el.input.value = hitList.join('\n'); el.input.classList.add('success-mode');
            addLog('hit', '>>> Başarılı çerezler ekrana filtrelendi.');
        } else {
            el.input.value = "Test edilen tüm veriler geçersiz.";
        }
    }
</script>
</body>
</html>
